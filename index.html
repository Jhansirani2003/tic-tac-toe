<main class="game">
    <h1>❌ Tic-Tac-Toe ⭕</h1>

    <p id="status">Player X's turn</p>

    <div class="board" id="board">
        <button class="cell" aria-label="Cell 1"></button>
        <button class="cell" aria-label="Cell 2"></button>
        <button class="cell" aria-label="Cell 3"></button>
        <button class="cell" aria-label="Cell 4"></button>
        <button class="cell" aria-label="Cell 5"></button>
        <button class="cell" aria-label="Cell 6"></button>
        <button class="cell" aria-label="Cell 7"></button>
        <button class="cell" aria-label="Cell 8"></button>
        <button class="cell" aria-label="Cell 9"></button>
    </div>

    <div class="scores">
        <div>Player X<strong id="scoreX">0</strong></div>
        <div>Draws<strong id="draws">0</strong></div>
        <div>Player O<strong id="scoreO">0</strong></div>
    </div>

    <button class="reset" id="reset">New Game</button>
</main>

<script>
    const cells = document.querySelectorAll(".cell");
    const statusText = document.getElementById("status");
    const resetButton = document.getElementById("reset");

    let currentPlayer = "X";
    let gameActive = true;
    let board = Array(9).fill("");

    let scoreX = 0;
    let scoreO = 0;
    let draws = 0;

    const winningCombinations = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
    ];

    function checkWinner() {
        for (const combination of winningCombinations) {
            const [a, b, c] = combination;

            if (
                board[a] &&
                board[a] === board[b] &&
                board[a] === board[c]
            ) {
                return currentPlayer;
            }
        }

        return null;
    }

    function updateScores() {
        document.getElementById("scoreX").textContent = scoreX;
        document.getElementById("scoreO").textContent = scoreO;
        document.getElementById("draws").textContent = draws;
    }

    function handleCellClick(event) {
        const cell = event.currentTarget;
        const index = Array.from(cells).indexOf(cell);

        if (!gameActive || board[index] !== "") {
            return;
        }

        board[index] = currentPlayer;
        cell.textContent = currentPlayer;
        cell.classList.add(currentPlayer.toLowerCase());
        cell.disabled = true;

        const winner = checkWinner();

        if (winner) {
            statusText.textContent = `🎉 Player ${winner} wins!`;
            gameActive = false;

            if (winner === "X") {
                scoreX++;
            } else {
                scoreO++;
            }

            updateScores();
            return;
        }

        if (board.every(value => value !== "")) {
            statusText.textContent = "🤝 It's a draw!";
            draws++;
            gameActive = false;
            updateScores();
            return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.textContent = `Player ${currentPlayer}'s turn`;
    }

    function newGame() {
        board = Array(9).fill("");
        currentPlayer = "X";
        gameActive = true;

        cells.forEach(cell => {
            cell.textContent = "";
            cell.disabled = false;
            cell.classList.remove("x", "o");
        });

        statusText.textContent = "Player X's turn";
    }

    cells.forEach(cell => {
        cell.addEventListener("click", handleCellClick);
    });

    resetButton.addEventListener("click", newGame);
</script>
